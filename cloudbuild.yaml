steps:
  # Build all 5 backend services
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/cartiq-orchestrator', 'backend/orchestrator']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/cartiq-cart-parser', 'backend/cart-parser']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/cartiq-behavior-agent', 'backend/behavior-agent']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/cartiq-context-engine', 'backend/context-engine']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/cartiq-optimization', 'backend/optimization']

  # Push all images
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/cartiq-orchestrator']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/cartiq-cart-parser']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/cartiq-behavior-agent']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/cartiq-context-engine']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/cartiq-optimization']

images:
  - 'gcr.io/$PROJECT_ID/cartiq-orchestrator'
  - 'gcr.io/$PROJECT_ID/cartiq-cart-parser'
  - 'gcr.io/$PROJECT_ID/cartiq-behavior-agent'
  - 'gcr.io/$PROJECT_ID/cartiq-context-engine'
  - 'gcr.io/$PROJECT_ID/cartiq-optimization'
